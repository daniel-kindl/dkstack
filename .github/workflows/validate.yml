name: validate

# Runs every repository check. The job name "validate" is the required
# status check context for main. Do not rename it.
# This workflow does not tag, release or publish.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the old run of that pull request.
# A push to main is never cancelled: each commit on main gets a full run.
concurrency:
  group: validate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The diff checks need the pull request target or the history before the push.
          fetch-depth: 0

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Each check runs when an earlier check fails, so one run shows all failures.
      - name: Check that the PR title is a conventional commit
        if: ${{ !cancelled() && steps.node.outcome == 'success' && github.event_name == 'pull_request' }}
        run: node scripts/check-title.mjs --event

      # A push to main has no pull request title, so this check runs only on a pull request.
      - name: Check that a breaking change has "!" in the title and a Consumer action line
        if: ${{ !cancelled() && steps.node.outcome == 'success' && github.event_name == 'pull_request' }}
        run: node scripts/check-breaking.mjs --event --base "$PR_BASE"

      - name: Check that the PR body links an issue and has the evidence lines
        if: ${{ !cancelled() && steps.node.outcome == 'success' && github.event_name == 'pull_request' }}
        run: node scripts/check-pr-body.mjs --event

      - name: Check that the commit titles of the push are conventional commits
        if: ${{ !cancelled() && steps.node.outcome == 'success' && github.event_name == 'push' }}
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Check each commit of the push, not only the last one.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$GITHUB_SHA~1"
          fi
          # A git log error must fail the step, so save the Git output before the loop.
          commits=$(mktemp)
          trap 'rm -f "$commits"' EXIT
          git log --format='%h %s' "$BEFORE..$GITHUB_SHA" > "$commits" || exit 1
          status=0
          while IFS= read -r commit; do
            echo "Check commit ${commit%% *}."
            node scripts/check-title.mjs -- "${commit#* }" || status=1
          done < "$commits"
          exit "$status"

      - name: Check the skill folders and frontmatter
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm run check:skills

      - name: Check that relative and repository links resolve
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm run check:links

      - name: Check that Markdown has no em dash or en dash
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm run check:dashes

      - name: Check the workflow pins, permissions, timeouts, release rules and allowed secrets
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm run check:workflows

      # The binary is fixed by version and SHA-256. The runner image has shellcheck.
      - name: Check the workflows with actionlint and shellcheck
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          command -v shellcheck
          ARCHIVE="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$ARCHIVE" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $ARCHIVE" | sha256sum --check --strict
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -no-color -shellcheck=shellcheck

      - name: Check that CHANGELOG.md has an entry for the package.json version
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm run check:changelog

      - name: Check that a new page or skill changes CHANGELOG.md under Unreleased
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node scripts/check-changelog.mjs --diff --base "${PR_BASE:-origin/main}"

      - name: Check the format of the maps in docs/maps
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm run check:maps

      - name: Check that a map change touches only maps, ADRs and CONTEXT.md, and deletes no map
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node scripts/check-maps.mjs --diff --base "${PR_BASE:-origin/main}"

      - name: Check the format of CONTEXT.md
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm run check:context

      - name: Check that new ADRs have Status and Affects
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]] && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA=HEAD~1
          fi
          npm run check:adrs -- --base "$BASE_SHA"

      - name: Check that the change adds no blanket suppression and no suppression without a reason, and warn about weaker gates
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm run check:suppressions -- --base "${PR_BASE:-origin/main}"

      - name: Check that each TODO in scripts and test has an issue reference
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm run check:todos

      # This check fails when it finds a long step, a long sentence or a semicolon.
      - name: Check for long steps, long sentences and semicolons in Markdown
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm run check:writing

      - name: Run the unit tests
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm test
