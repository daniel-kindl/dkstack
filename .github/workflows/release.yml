name: Release

# Daniel starts this workflow by hand on main. It does the full dkstack v1
# release in two jobs:
# - plan (read-only): it checks the last release and the release
#   environment, and works out the next version from the commits since the
#   latest v1.x.y tag. A breaking change stops the run: a major release needs
#   Daniel. It writes the version and the commits to the run summary.
# - release (environment "release"): it waits until Daniel approves the
#   environment for the version in the summary. Then:
# 1. It prepares CHANGELOG.md and package.json for the planned version on
#    the branch release/vX.Y.Z. It stops if the version is different.
# 2. It opens a pull request to main and starts validate on that branch.
# 3. It squash-merges the pull request when validate passes.
# 4. It tags the merge commit, publishes the GitHub release and
#    fast-forwards v1 to the merge commit.
# Nothing reaches main, no tag is made and v1 does not move unless validate
# passes. The workflow never force-pushes. It uses only GITHUB_TOKEN.
# For recovery after a failed run, see versioning/index.md.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump: auto (from the commits), patch or minor"
        type: choice
        default: auto
        options: [auto, patch, minor]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
    env:
      BUMP: ${{ inputs.bump }}
    steps:
      - name: Stop unless the run is on main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Start Release on main, not on $GITHUB_REF."
            exit 1
          fi

      - name: Check out main with all branches and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Stop if the last release is not complete
        run: node scripts/release.mjs guard --v1 origin/v1

      - name: Work out the version and write it to the run summary
        id: plan
        run: node scripts/release.mjs plan --bump "$BUMP"

      # The environment endpoints need only read access to the repository.
      # A job that names an environment that does not exist gets a new one
      # with no protection, so the release job must not start without this check.
      - name: Read the release environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/release" > "$RUNNER_TEMP/environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/release/deployment-branch-policies" > "$RUNNER_TEMP/policies.json"

      - name: Stop unless Daniel must approve the release environment
        run: node scripts/release.mjs environment "$RUNNER_TEMP/environment.json" "$RUNNER_TEMP/policies.json" --reviewer daniel-kindl

  release:
    name: release
    needs: plan
    # Daniel approves this environment after he reads the planned version.
    environment: release
    runs-on: ubuntu-latest
    # More than all the waits together: find validate (3 minutes), wait for
    # approval (15 minutes), watch validate (15 minutes) and the merge state
    # (1 minute), with time for the other steps.
    timeout-minutes: 45
    # GITHUB_TOKEN only reads. The release app token does all the writes.
    permissions:
      actions: read # find and watch the validate run of the release pull request
      checks: read # read the checks of the release pull request
      contents: read # check out main
      pull-requests: read # read the merge state of the release pull request
    env:
      BUMP: ${{ inputs.bump }}
      START_SHA: ${{ github.sha }}
    steps:
      - name: Check out main with all branches and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # No token stays in .git/config while repository code runs.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Stop if the last release is not complete
        run: node scripts/release.mjs guard --v1 origin/v1

      - name: Prepare CHANGELOG.md and package.json for the planned version
        id: prepare
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release.mjs prepare --bump "$BUMP" --date "$(TZ=Europe/Prague date +%F)" --expect "$VERSION"

      - name: Run the repository checks on the prepared release
        run: npm run check

      # The last step that runs repository code. The steps after it run only
      # git and gh.
      - name: Commit the release and write the notes
        id: branch
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          BRANCH="release/v$VERSION"
          TITLE="chore(release): prepare v$VERSION"
          node scripts/check-title.mjs "$TITLE"
          node scripts/release.mjs notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -q -m "$TITLE" -- CHANGELOG.md package.json
          {
            echo "branch=$BRANCH"
            echo "title=$TITLE"
            echo "head_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # The release app token. Daniel set up the app on 2026-11-11 (#135): it
      # has Contents, Pull requests and Workflows (read and write) and is
      # installed on dkstack only. It is in no ruleset bypass list, so
      # protect-main still requires validate. The token is for dkstack only,
      # with these three permissions only. The action masks it and revokes it
      # at the end of the job. Only the git and gh steps that write get it.
      # The token, not GITHUB_TOKEN, opens the pull request, so the normal
      # pull_request run of validate starts. Workflows (write) lets the token
      # move v1 when the release changes files in .github/workflows.
      - name: Get a token from the release app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dkstack
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Push the release branch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          # git gets the token from gh at each push. The token is not written to disk.
          gh auth setup-git
          # A branch that exists already makes this push fail. It does not overwrite it.
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Open the release pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          TITLE: ${{ steps.branch.outputs.title }}
        run: |
          BODY="$RUNNER_TEMP/body.md"
          {
            echo "The Release workflow opened this pull request for v$VERSION."
            echo "It merges the pull request when validate passes."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } > "$BODY"
          URL=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$BODY")
          echo "Opened $URL"
          echo "pr=${URL##*/}" >> "$GITHUB_OUTPUT"

      # protect-main requires the check "validate" of the pull_request run.
      # The run can wait for approval, because the app is a first-time
      # contributor. Only Daniel approves it. No agent and no job approves
      # it. The job waits for him, reads the run state only, and stops after
      # 15 minutes. Then the cleanup step closes the pull request.
      - name: Wait for validate on the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          HEAD_SHA: ${{ steps.branch.outputs.head_sha }}
        run: |
          RUN=""
          for _ in $(seq 1 36); do
            RUN=$(gh run list --workflow validate.yml --branch "$BRANCH" --event pull_request --commit "$HEAD_SHA" \
              --limit 1 --json databaseId,status,conclusion --jq '.[0] // empty | "\(.databaseId) \(.status) \(.conclusion)"')
            if [ -n "$RUN" ]; then break; fi
            sleep 5
          done
          if [ -z "$RUN" ]; then
            echo "::error::validate did not start on pull request #$PR. Nothing was merged."
            exit 1
          fi
          read -r RUN_ID RUN_STATUS RUN_CONCLUSION <<< "$RUN"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          echo "validate: $RUN_URL"
          if [ "$RUN_STATUS" = "action_required" ] || [ "$RUN_CONCLUSION" = "action_required" ]; then
            MESSAGE="Daniel: approve this workflow run yourself; no agent approves it: $RUN_URL"
            echo "::warning::validate on pull request #$PR waits for approval. $MESSAGE"
            {
              echo "validate on pull request #$PR waits for approval."
              echo
              echo "$MESSAGE"
              echo
              echo "The job waits up to 15 minutes. It merges nothing before validate passes."
            } >> "$GITHUB_STEP_SUMMARY"
            for _ in $(seq 1 90); do
              sleep 10
              RUN=$(gh run list --workflow validate.yml --branch "$BRANCH" --event pull_request --commit "$HEAD_SHA" \
                --limit 1 --json databaseId,status,conclusion --jq '.[0] // empty | "\(.databaseId) \(.status) \(.conclusion)"')
              read -r RUN_ID RUN_STATUS RUN_CONCLUSION <<< "$RUN"
              if [ "$RUN_STATUS" != "action_required" ] && [ "$RUN_CONCLUSION" != "action_required" ]; then break; fi
            done
            RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
            if [ "$RUN_STATUS" = "action_required" ] || [ "$RUN_CONCLUSION" = "action_required" ]; then
              echo "::error::validate on pull request #$PR was not approved in 15 minutes: $RUN_URL. Nothing was merged."
              exit 1
            fi
            echo "validate was approved: $RUN_URL"
          fi
          if ! timeout 900 gh run watch "$RUN_ID" --exit-status --interval 15 > /dev/null; then
            echo "::error::validate did not pass on pull request #$PR: $RUN_URL. Nothing was merged."
            exit 1
          fi

      - name: Wait until protect-main lets the pull request merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$MAIN_SHA" != "$START_SHA" ]; then
            echo "::error::main moved from $START_SHA to $MAIN_SHA during the run. Nothing was merged or tagged."
            exit 1
          fi
          # GitHub needs some seconds to update the merge state.
          STATE=""
          for _ in $(seq 1 12); do
            STATE=$(gh pr view "$PR" --json mergeStateStatus --jq .mergeStateStatus)
            if [ "$STATE" = "CLEAN" ]; then break; fi
            sleep 5
          done
          if [ "$STATE" != "CLEAN" ]; then
            echo "::error::Pull request #$PR is not ready to merge (state $STATE). Nothing was merged. The state follows."
            gh pr view "$PR" --json mergeStateStatus,reviewDecision,statusCheckRollup
            exit 1
          fi

      - name: Merge the release pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.pr.outputs.pr }}
          TITLE: ${{ steps.branch.outputs.title }}
          HEAD_SHA: ${{ steps.branch.outputs.head_sha }}
        run: |
          MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$MAIN_SHA" != "$START_SHA" ]; then
            echo "::error::main moved from $START_SHA to $MAIN_SHA during the run. Nothing was merged or tagged."
            exit 1
          fi
          # --match-head-commit: merge only the commit that validate checked.
          # protect-main also rejects the merge if main moved (strict checks).
          gh pr merge "$PR" --squash --match-head-commit "$HEAD_SHA" --subject "$TITLE (#$PR)"

      - name: Check the merge commit
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr }}
          HEAD_SHA: ${{ steps.branch.outputs.head_sha }}
        run: |
          MERGE_SHA=$(gh pr view "$PR" --json mergeCommit --jq .mergeCommit.oid)
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          git fetch -q origin main
          if [ "$(git rev-parse "$MERGE_SHA^")" != "$START_SHA" ]; then
            echo "::error::The merge commit $MERGE_SHA does not follow $START_SHA. main moved. No tag was made."
            exit 1
          fi
          if [ "$(git rev-parse "$MERGE_SHA^{tree}")" != "$(git rev-parse "$HEAD_SHA^{tree}")" ]; then
            echo "::error::The merge commit $MERGE_SHA has other files than the validated commit $HEAD_SHA. No tag was made."
            exit 1
          fi

      - name: Tag the merge commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          git tag -a "v$VERSION" "$MERGE_SHA" -m "v$VERSION"
          git push origin "refs/tags/v$VERSION"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          # The notes come from the validated tree, which is the tree of the tag.
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Fast-forward v1 to the release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          git fetch -q origin refs/heads/v1:refs/remotes/origin/v1
          if ! git merge-base --is-ancestor origin/v1 "$MERGE_SHA"; then
            echo "::error::v1 is not an ancestor of $MERGE_SHA. A fast-forward is not possible. v1 did not move."
            exit 1
          fi
          # A normal push. protect-v1 rejects a push that is not a fast-forward.
          if ! git push origin "$MERGE_SHA:refs/heads/v1"; then
            echo "::error::The push to v1 failed. v1 did not move. See \"Finish a release\" in versioning/index.md."
            exit 1
          fi
          {
            echo "Released v$VERSION at $MERGE_SHA."
            echo
            echo "- Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
            echo "- v1 is at $MERGE_SHA."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close the release pull request if it was not merged
        if: ${{ failure() && steps.pr.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.pr.outputs.pr }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          HEAD_SHA: ${{ steps.branch.outputs.head_sha }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          STATE=$(gh pr view "$PR" --json state --jq .state)
          if [ "$STATE" != "OPEN" ]; then
            echo "Pull request #$PR is $STATE. Nothing to close."
            exit 0
          fi
          gh pr close "$PR" --comment "The Release run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID failed before the merge. Nothing was merged or tagged. Fix the cause, then start Release again."
          # Delete the branch only if it is still at the release commit.
          BRANCH_SHA=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ "$BRANCH_SHA" = "$HEAD_SHA" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
          else
            echo "::warning::$BRANCH is at ${BRANCH_SHA:-nothing}, not at $HEAD_SHA. It was not deleted."
          fi
          {
            echo "Release v$VERSION was not merged. The run failed before the merge. See the error above."
            echo
            echo "- main, the tags and v1 did not change."
            echo "- The job closed pull request #$PR and deleted the branch $BRANCH if it was unchanged."
            echo "- Fix the cause, then start Release again."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tell how to finish a release after the merge
        if: ${{ failure() && steps.merge.outputs.merge_sha != '' }}
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          {
            echo "The release commit $MERGE_SHA is on main, but a later step failed."
            echo "Finish v$VERSION by hand. See \"Finish a release\" in versioning/index.md."
          } >> "$GITHUB_STEP_SUMMARY"
