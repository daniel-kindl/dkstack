name: Version

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check conventional commits
        run: |
          echo "Pipeline ready. Versioning infrastructure is in place."
          echo "No automatic publish or release will occur until explicitly enabled."
          echo "Current package version:"
          node -p "require('./package.json').version"

      - name: Validate structure
        run: |
          test -f AGENTS.md
          test -f package.json
          test -d skills
          test -d architecture
          echo "Structure valid."
